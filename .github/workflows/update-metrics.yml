name: 更新个人数据

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/generate-metrics.mjs
      - .github/workflows/update-metrics.yml

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  generate:
    name: 生成动态数据面板
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 生成数据面板
        run: node scripts/generate-metrics.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      - name: 提交更新
        shell: bash
        run: |
          if git diff --quiet -- assets/github-metrics-*.svg; then
            echo "数据没有变化，无需提交"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-metrics-*.svg
          git commit -m "chore: update profile metrics"
          git push
